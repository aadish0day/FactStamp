<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Glows -->
    <radialGradient id="bgBase" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#261611"/>
      <stop offset="45%" stop-color="#14100e"/>
      <stop offset="100%" stop-color="#090807"/>
    </radialGradient>

    <radialGradient id="brandOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#c4542a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradients for Cards & Stamps -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="falseStampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1a17"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>

    <linearGradient id="bentoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="100%" stop-color="#14100e"/>
    </linearGradient>

    <!-- Dot Mesh Pattern -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <!-- Shadow Filters -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="stampGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="160" r="420" fill="url(#brandOrb)"/>
  <circle cx="980" cy="480" r="340" fill="url(#emeraldOrb)"/>

  <!-- Top Glass Highlight Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#brandGrad)"/>

  <!-- Architectural Frame Hairlines -->
  <line x1="50" y1="50" x2="1150" y2="50" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="50" y1="580" x2="1150" y2="580" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="50" y1="50" x2="50" y2="580" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="1150" y1="50" x2="1150" y2="580" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Corner Crosshair Marks -->
  <path d="M44 50h12M50 44v12" stroke="#ea580c" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M1144 50h12M1150 44v12" stroke="#ea580c" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M44 580h12M50 574v12" stroke="#ea580c" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M1144 580h12M1150 574v12" stroke="#ea580c" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- ── Left Column: Brand Identity & Thesis ── -->
  <g transform="translate(90, 95)">
    <!-- Category Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="32" rx="16" fill="#ea580c" fill-opacity="0.14" stroke="#ea580c" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="18" cy="16" r="4.5" fill="#f97316"/>
      <text x="32" y="20" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">COMMUNITY FACT-CHECKING LAYER</text>
    </g>

    <!-- Main Header & Brand -->
    <g transform="translate(0, 60)">
      <!-- Brand Icon + Name -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="14" fill="url(#brandGrad)"/>
        <path d="M26 11.5l13 5v10c0 9-6.2 16.5-13 19.3-6.8-2.8-13-10.3-13-19.3v-10l13-5z" fill="#0d0b0a"/>
        <path d="M19 26l5 5 9-9" stroke="#f97316" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="70" y="38" fill="#ffffff" font-family="'DM Sans', system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">FactStamp</text>
      </g>

      <!-- Headline -->
      <text x="0" y="112" fill="#ffffff" font-family="'DM Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
        Stop WhatsApp Fake News
      </text>
      <text x="0" y="162" fill="#f97316" font-family="'DM Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
        Before It Spreads.
      </text>

      <!-- Subhead -->
      <text x="0" y="218" fill="#a8a29e" font-family="'DM Sans', system-ui, sans-serif" font-size="19" font-weight="400" leading="1.5">
        Transparent consensus fact-checking for viral Indian forwards
      </text>
      <text x="0" y="246" fill="#a8a29e" font-family="'DM Sans', system-ui, sans-serif" font-size="19" font-weight="400" leading="1.5">
        with source evidence &amp; 1080p downloadable PNG cards.
      </text>
    </g>

    <!-- Bento Stat Cards Row -->
    <g transform="translate(0, 360)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="162" height="72" rx="14" fill="url(#bentoCardBg)" stroke="#2e2723" stroke-width="1"/>
      <text x="18" y="34" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">12,840+</text>
      <text x="18" y="54" fill="#78716c" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">CLAIMS DEBUNKED</text>

      <!-- Card 2 -->
      <rect x="174" y="0" width="162" height="72" rx="14" fill="url(#bentoCardBg)" stroke="#2e2723" stroke-width="1"/>
      <text x="192" y="34" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">99.4%</text>
      <text x="192" y="54" fill="#78716c" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">ACCURACY RATE</text>

      <!-- Card 3 -->
      <rect x="348" y="0" width="162" height="72" rx="14" fill="url(#bentoCardBg)" stroke="#2e2723" stroke-width="1"/>
      <text x="366" y="34" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">&lt; 3 min</text>
      <text x="366" y="54" fill="#78716c" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">VERIFY TIME</text>
    </g>
  </g>

  <!-- ── Right Column: High-Precision Fact-Check Card Showcase ── -->
  <g transform="translate(670, 75)">
    <!-- Outer Card Shell with 3D Shadow -->
    <rect width="450" height="480" rx="24" fill="url(#cardBg)" stroke="#443932" stroke-width="1.5" filter="url(#heroShadow)"/>

    <!-- Subtle Inner Top Highlight -->
    <rect x="1.5" y="1.5" width="447" height="477" rx="22.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Card Header -->
    <g transform="translate(32, 32)">
      <rect width="36" height="36" rx="10" fill="url(#brandGrad)"/>
      <path d="M18 8.5l9 3.5v6.5c0 4.8-3.4 8.6-9 10.2-5.6-1.6-9-5.4-9-10.2v-6.5l9-3.5z" fill="#0d0b0a"/>
      <path d="M13.5 18l3 3 6-6" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <text x="48" y="21" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="18" font-weight="800">FactStamp</text>
      <text x="48" y="33" fill="#78716c" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.8">WHATSAPP FACT-CHECK CARD</text>

      <!-- Category Pill -->
      <rect x="286" y="4" width="96" height="26" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="334" y="21" fill="#dc2626" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.6">POLITICAL</text>
    </g>

    <line x1="32" y1="88" x2="418" y2="88" stroke="#2a231f" stroke-width="1"/>

    <!-- Claim Content Box -->
    <g transform="translate(32, 104)">
      <text x="0" y="14" fill="#78716c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">CLAIM FORWARDED:</text>
      <rect x="0" y="24" width="386" height="88" rx="12" fill="#241d1a" stroke="#332924" stroke-width="1"/>
      <text x="16" y="52" fill="#e7e5e4" font-family="'DM Sans', sans-serif" font-size="13" font-style="italic" font-weight="500">“Election Commission makes it mandatory for every</text>
      <text x="16" y="74" fill="#e7e5e4" font-family="'DM Sans', sans-serif" font-size="13" font-style="italic" font-weight="500">voter to link their personal mobile phone to voter ID</text>
      <text x="16" y="94" fill="#e7e5e4" font-family="'DM Sans', sans-serif" font-size="13" font-style="italic" font-weight="500">or votes will be cancelled.”</text>
    </g>

    <!-- Central Rubber Stamp Badge (Tilted -2.5 degrees) -->
    <g transform="translate(32, 235)">
      <g transform="rotate(-2.5, 193, 60)">
        <rect width="386" height="120" rx="16" fill="#fff5f5" stroke="#fecaca" stroke-width="2.5" filter="url(#stampGlow)"/>
        <!-- Inner Stamp Groove Border -->
        <rect x="5" y="5" width="376" height="110" rx="12" fill="none" stroke="#fca5a5" stroke-dasharray="6,4" stroke-width="1.2"/>

        <g transform="translate(24, 20)">
          <circle cx="40" cy="40" r="26" fill="url(#falseStampGrad)"/>
          <!-- X Circle Icon -->
          <path d="M30 30l20 20M50 30l-20 20" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

          <!-- Label -->
          <text x="82" y="47" fill="#dc2626" font-family="'DM Sans', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">FALSE</text>

          <!-- Confidence Badge -->
          <rect x="228" y="24" width="108" height="28" rx="14" fill="#dc2626" fill-opacity="0.12"/>
          <text x="282" y="43" fill="#b91c1c" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">94% Confidence</text>
        </g>
      </g>
    </g>

    <!-- Source Evidence Bar -->
    <g transform="translate(32, 380)">
      <rect width="386" height="42" rx="10" fill="#1c1714" stroke="#2e2723" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#10b981"/>
      <text x="32" y="25" fill="#a8a29e" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Source: </text>
      <text x="80" y="25" fill="#e7e5e4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">eci.gov.in (Official)</text>
      <text x="370" y="25" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">factstamp.vercel.app</text>
    </g>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(90, 555)">
    <text x="0" y="0" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">factstamp.vercel.app</text>
    <text x="1020" y="0" fill="#78716c" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" text-anchor="end">India's Community WhatsApp Fact-Check Platform</text>
  </g>
</svg>
