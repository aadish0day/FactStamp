name: CI

on:
  push:
  workflow_dispatch:

# Cancel superseded runs when pushing multiple commits in quick succession
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (matches Dockerfile node:20-slim)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production build (tsc -b && vite build)
        run: npm run build

  docker-compose-config:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        # `-q` validates with a clean exit code without dumping the resolved
        # config into the logs. `env_file` entries use `required: false`, so
        # this passes on fresh clones where `.env` doesn't exist yet.
        run: docker compose config -q
