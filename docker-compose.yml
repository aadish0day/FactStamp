services:
  # ── Development (Vite dev server + hot reload) ──
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: factstamp:dev
    container_name: factstamp-dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  # ── Production (nginx serve) ──
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: serve
    image: factstamp:latest
    container_name: factstamp-prod
    ports:
      - "8080:80"
    restart: unless-stopped
